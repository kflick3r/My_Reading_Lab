<!DOCTYPE html>
<html>
    <head>
        <title>Dashboard</title>
    </head>
    <body>
        <h1>Your Reading Stats</h1>

        <p><b>Total Books:</b> {{ stats.total_books }}</p>
        <p><b>Average Rating:</b> {{ stats.avg_rating }}</p>
        <p><b>Most Common Author:</b> {{ stats.most_common_author }}</p>

        <img src="{{ url_for('static', filename=chart1) }}">
        <img src="{{ url_for('static', filename=chart2) }}">

        <div class="card">
            <h2>Most Active Year</h2>
            <p>{{ stats.favorite_year }} ({{ stats.best_year_count }} books)</p>
        </div>

        <a href="/upload">Upload another file</a>
    </body>
</html>
