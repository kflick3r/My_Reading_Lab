<!DOCTYPE html>
<html>
    <head>
        <title>Upload Goodreads CSV</title>
    </head>
    <body>
        <h1>Upload your Goodreads CSV</h1>

        <form action=""/upload" method="POST" enctype="multipart/form-data">
            <input type="file" name="file" accept=".csv" required>
            <button type="submit">Upload</button>
        </form>
    </body>
</html>
