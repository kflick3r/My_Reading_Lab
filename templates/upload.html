<!DOCTYPE html>
<html>
    <head>
        <title>Upload Goodreads CSV</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <script src="{{ url_for('static', filename='script.js') }}"></script>
    </head>

    <body class="page-upload">
        <div class="container">
            
            <div class="top-bar">
                <h1>Upload your Goodreads CSV</h1>
                <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
            </div>

            <div class="card upload-card">
                <form action="/upload" method="POST" enctype="multipart/form-data" onsubmit="setThemeInput()">
                    <input type="hidden" name="theme" id="theme-input">
                    <input type="file" name="file" accept=".csv" required>
                    <br>
                    <button type="submit">Upload</button>
                </form>
            </div>

            <div class="center">
                <a href="/" class="btn">Back to Home Page</a>
            </div>

        </div>
    </body>
</html>
